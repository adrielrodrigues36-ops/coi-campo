<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despacho e Apontamentos | COI Ambiental Ceará</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--az:#0027BD;--azs:#111799;--tq:#17E3CB;--c1:#E2E5F0;--c0:#F4F6FB;--vp:#E0464A;--ap:#F8DC00;--mg:#E12379;--vd:#12A36B;--tx:#0B1A5C;--q:#5A6699;--ln:#D3D8EA}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--tx);background:var(--c0);font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--tx)}
.top{background:#fff;border-bottom:4px solid var(--az);display:flex;align-items:center;gap:16px;padding:9px 20px;position:sticky;top:0;z-index:1000}
.top img{height:36px}.top .tit{font-size:18px;font-weight:700;color:var(--az)}.top .tit span{font-family:Georgia,serif;font-style:italic;font-weight:400}
.top .sp{flex:1}.top .user{font-size:12px;color:var(--q);text-align:right;line-height:1.35}
.nav{display:flex;gap:2px;padding:0 20px;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:57px;z-index:999;overflow-x:auto}
.nav button{border:0;background:none;padding:11px 15px;font-weight:700;color:var(--q);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.nav button.on{color:var(--az);border-bottom-color:var(--mg)}
main{padding:16px 20px 50px;max-width:1700px;margin:0 auto}
.h1{font-size:21px;font-weight:700;color:var(--az);margin:2px 0 12px}.h1 .serif,.serif{font-family:Georgia,serif;font-style:italic;font-weight:400}
.sub{color:var(--q);font-size:13px;margin:-6px 0 14px}
.tag{display:inline-block;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:10px;padding:11px 14px;border-left:5px solid var(--az);cursor:pointer}
.kpi .n{font-size:26px;font-weight:700;line-height:1.1}.kpi .l{font-size:12px;color:var(--q);margin-top:3px}
.kpi.on{outline:2px solid var(--az)}
.live{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,1fr);gap:14px;align-items:start}
@media(max-width:1100px){.live{grid-template-columns:1fr}}
#mapa{height:calc(100vh - 250px);min-height:420px;border-radius:12px;background:#dfe5f3;position:sticky;top:120px}
.lista{max-height:calc(100vh - 250px);overflow:auto;padding-right:4px}
.eqc{background:#fff;border-radius:10px;padding:11px 13px;margin-bottom:9px;border-left:6px solid #B8BED6;cursor:pointer}
.eqc:hover{box-shadow:0 2px 10px rgba(0,39,189,.12)}
.eqc .l1{display:flex;align-items:center;gap:8px}.eqc .cod{font-weight:700;color:var(--az)}.eqc .nm{color:var(--q);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqc .at{font-size:15px;font-weight:700;margin:5px 0 2px}.eqc .dt{font-size:12px;color:var(--q)}
.eqc .al{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.box{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px}.box h3{font-size:15px;color:var(--az);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th{text-align:left;font-size:12px;color:var(--az);padding:9px 7px;border-top:2px solid var(--az);border-bottom:2px solid var(--az);white-space:nowrap;position:sticky;top:0;background:#fff}
table.t td{padding:8px 7px;border-bottom:1px solid var(--c1);font-size:13px;vertical-align:top}
table.t tr.r{cursor:pointer}table.t tr.r:hover td{background:#EEF1FB}
.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--az);color:#fff}
.btn:hover{background:var(--azs)}.btn.sec{background:#fff;color:var(--az);border:1.5px solid var(--az)}.btn.mg{background:var(--mg)}.btn.ok{background:var(--vd)}.btn.red{background:var(--vp)}.btn.sm{padding:4px 9px;font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filtros input,.filtros select{padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:#fff}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 12px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--az);margin-bottom:4px}.f label i{color:var(--mg);font-style:normal}
.f input,.f select,.f textarea{width:100%;padding:8px 9px;border:1px solid var(--ln);border-radius:6px;background:#fff}
.f.w2{grid-column:span 2}.f.w3{grid-column:1/-1}
.ov{position:fixed;inset:0;background:rgba(11,26,92,.45);z-index:2000;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 12px}
.md{background:var(--c0);border-radius:12px;width:min(900px,100%)}.md .mh{background:#fff;border-radius:12px 12px 0 0;padding:13px 18px;border-bottom:3px solid var(--az);display:flex;align-items:center;gap:10px}
.md .mh h3{margin:0;color:var(--az);font-size:17px}.md .mh .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--q)}.md .mb{padding:16px 18px}
/* gantt */
.gt{background:#fff;border-radius:10px;padding:10px 14px;overflow-x:auto}
.gr{display:grid;grid-template-columns:150px 1fr 90px;align-items:center;border-bottom:1px solid var(--c1);min-height:38px}
.gr .lb{font-size:12px;font-weight:700;color:var(--az);line-height:1.2}.gr .lb small{display:block;color:var(--q);font-weight:400}
.gr .tr{position:relative;height:26px;background:repeating-linear-gradient(135deg,#F1F2F7,#F1F2F7 5px,#fff 5px,#fff 10px);border-radius:4px}
.gr .tr .tu{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#FCE3E4,#FCE3E4 4px,#fff 4px,#fff 8px);border:1px dashed #F2A5A7;border-radius:4px}
.gr .tr .b{position:absolute;top:3px;bottom:3px;border-radius:3px;cursor:pointer;min-width:2px;overflow:hidden;color:#fff;font-size:10px;line-height:20px;padding-left:2px;white-space:nowrap}
.gr .pr{font-size:12px;text-align:right;font-weight:700}
.esc{display:grid;grid-template-columns:150px 1fr 90px}.esc .tr{position:relative;height:18px;font-size:10px;color:var(--q)}.esc .tr span{position:absolute;transform:translateX(-50%)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin:8px 0}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sb{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--c1);min-width:160px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:11px 20px;border-radius:8px;z-index:3000;font-weight:700}
.login{max-width:400px;margin:70px auto;background:#fff;border-radius:14px;padding:28px 30px;border-top:6px solid var(--az)}.login img{height:50px;margin-bottom:12px}.login .f{margin-bottom:12px}
.erro{background:#FFECEC;border:1px solid var(--vp);border-radius:8px;padding:9px 12px;color:#9B1C20;margin-bottom:12px}
.vz{padding:26px;text-align:center;color:var(--q)}
.mk{border-radius:14px;color:#fff;font-weight:700;font-size:11px;padding:3px 7px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap}
/* card do dia */
.wc{width:1080px;background:#fff;font-family:Arial,Helvetica,sans-serif;color:var(--tx)}
.wc .hd{background:var(--az);color:#fff;padding:24px 38px;display:flex;align-items:center;gap:20px}.wc .hd .lg{background:#fff;border-radius:10px;padding:8px 12px;display:flex}.wc .hd .lg img{height:50px}
.wc .hd .k{font-size:16px;letter-spacing:2px;font-weight:700;opacity:.85}.wc .hd .p{font-size:30px;font-weight:700}
.wc .bd{padding:26px 38px}.wc table{width:100%;border-collapse:collapse}.wc th{font-size:15px;text-align:left;color:var(--az);border-top:3px solid var(--az);border-bottom:3px solid var(--az);padding:8px 6px}
.wc td{font-size:17px;padding:9px 6px;border-bottom:1px solid var(--c1)}.wc .kg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.wc .kg div{background:var(--c0);border-radius:10px;padding:14px;border-left:6px solid var(--az)}.wc .kg b{display:block;font-size:36px;color:var(--az)}.wc .kg span{font-size:15px;color:var(--q)}
.wc .ft{border-top:1px solid var(--c1);padding:16px 38px;display:flex;align-items:center;color:var(--q);font-size:15px}.wc .ft img{height:28px;margin-left:auto}
</style>
</head>
<body>
<div id="app"></div>

 ${msg?`<div class="erro">${esc(msg)}</div>`:''}<div class="f"><label>E-mail</label><input id="lg_e" type="email"></div><div class="f"><label>Senha</label><input id="lg_s" type="password"></div><button class="btn" style="width:100%;padding:11px" id="lg_b">Entrar</button></div>`;

 $('#tb').onclick=async()=>{const a=$('#t1').value;if(a.length<6||a!==$('#t2').value)return toast('Senhas não conferem ou são curtas');try{await rpc('sv_trocar_senha',{p_email:email,p_atual:atual,p_nova:a});const r=await rpc('sv_login',{p_email:email,p_senha:a});S.token=r.token;sessionStorage.setItem('ap_bo_tok',r.token);iniciar()}catch(e){erro(e)}}}

async function iniciar(){try{S.eu=await rpc('ap_bo_eu',{p_token:S.token})}catch(e){return telaLogin(/Sessão/.test(e.message)?'':e.message)}
 $('#app').innerHTML=`<div class="top"><img src="${LOGO_AC}"><div class="tit">Despacho e <span>Apontamentos</span> · COI</div><div class="sp"></div><div id="atz" style="font-size:12px;color:var(--q)"></div>
  <div class="user"><b>${esc(S.eu.nome)}</b><br>${S.eu.editor?'<span class="tag" style="background:var(--tq)">PROGRAMADOR · EDITA</span>':'<span class="tag" style="background:var(--c1)">LEITURA</span>'} · <a href="#" id="bs">Sair</a></div></div><div class="nav" id="nav"></div><main id="main"></main>`;
 $('#bs').onclick=e=>{e.preventDefault();sair()};await carregar();render();clearInterval(S.poll);S.poll=setInterval(async()=>{if(document.querySelector('.ov'))return;await carregar(true);if(['vivo','despacho'].includes(S.aba))render(true)},20000)}

 ({vivo:vVivo,despacho:vDespacho,linha:vLinha,ind:vInd,apont:vApont,cad:vCad})[S.aba](auto)}

// ===== situação de cada equipe =====
function situacao(e){const T=S.P.tarefas||[];const now=agora();const at=e.atual;const al=[];let cat=null,txt='Fora de turno';
 if(e.turno){if(at){cat=catDe(at);txt=at.tipo;const t=tipo(at.tipo);const ms=now-new Date(at.inicio);if(t.esp&&ms>t.esp*60000)al.push(['⏱ acima do previsto ('+t.esp+' min)','#FFF3B8']);
   if(t.id==='aguard_prog'||at.tipo==='Aguardando programação')al.push(['📵 equipe livre: despachar','#FDE7F0'])}
  else{cat='Sem apontamento';txt='Sem apontamento';al.push(['⏸ sem atividade','#FFE1E2'])}
  const sinc=e.ult_sync_em?now-new Date(e.ult_sync_em):1e12;if(sinc>10*60000)al.push(['📶 sem sinal há '+dur(sinc),'#FFE1E2'])}
 const pend=T.filter(t=>t.equipe_id===e.id&&t.status==='enviada');pend.forEach(t=>{if(now-new Date(t.criada_em)>10*60000)al.push(['📋 tarefa não aceita há '+dur(now-new Date(t.criada_em)),'#FFF3B8'])});
 return {cat,txt,al,tar:T.find(t=>t.equipe_id===e.id&&['aceita','em_deslocamento','em_execucao'].includes(t.status)),pend}}

// ===== AO VIVO =====
function vVivo(auto){const E=(S.P.equipes||[]).filter(e=>e.ativo);const sit=Object.fromEntries(E.map(e=>[e.id,situacao(e)]));
 const em=E.filter(e=>e.turno);const cnt=c=>em.filter(e=>sit[e.id].cat===c).length;const alertas=em.filter(e=>sit[e.id].al.length).length;
 const k=[['Em turno',em.length,'#0027BD',null],['Executando',cnt('Produtiva'),cor('Produtiva'),'Produtiva'],['Deslocando',cnt('Deslocamento'),cor('Deslocamento'),'Deslocamento'],['Apoio',cnt('Apoio operacional'),cor('Apoio operacional'),'Apoio operacional'],['Pausa',cnt('Pausa'),cor('Pausa'),'Pausa'],['Indisponível',cnt('Indisponível'),cor('Indisponível'),'Indisponível'],['Sem apontamento',cnt('Sem apontamento'),'#B8BED6','Sem apontamento'],['Com alerta',alertas,'#E12379','alerta']];
 const filt=E.filter(e=>!S.filtroCat||(S.filtroCat==='alerta'?e.turno&&sit[e.id].al.length:sit[e.id].cat===S.filtroCat)).sort((a,b)=>(!!b.turno-!!a.turno)||(sit[b.id].al.length-sit[a.id].al.length)||a.id.localeCompare(b.id));
 const lista=filt.map(e=>{const s=sit[e.id];const at=e.atual;const t=at?tipo(at.tipo):null;return `<div class="eqc" data-e="${esc(e.id)}" style="border-left-color:${e.turno?cor(s.cat):'#D3D8EA'};${e.turno?'':'opacity:.6'}">
   <div class="l1"><span class="cod">${esc(e.id)}</span><span class="nm">${esc(e.nome)}${e.tipo?' · '+esc(e.tipo):''}</span>${e.ult_bat!=null&&e.turno?`<span class="tag" style="background:${e.ult_bat<20?'#FFE1E2':'var(--c0)'}">🔋${Math.round(e.ult_bat)}%</span>`:''}</div>
   <div class="at">${t?t.ico+' ':''}${esc(s.txt)}${at?` <span style="font-weight:400;color:var(--q)">· ${dur(agora()-new Date(at.inicio))}</span>`:''}</div>
   <div class="dt">${at&&at.os?'OS '+esc(at.os)+' · ':''}${s.tar?'Tarefa: '+esc(s.tar.servico||'')+' ('+esc((ST_T[s.tar.status]||[s.tar.status])[0].toLowerCase())+') · ':''}${e.turno?'Turno desde '+hm(e.turno.inicio)+(e.turno.placa?' · '+esc(e.turno.placa):''):''}${e.ult_pos_em?' · 📍 '+hm(e.ult_pos_em):''}</div>
   ${s.al.length?`<div class="al">${s.al.map(a=>`<span class="tag" style="background:${a[1]}">${esc(a[0])}</span>`).join('')}</div>`:''}</div>`}).join('')||'<div class="vz">Nenhuma equipe nesse filtro.</div>';
 if(auto&&S.mapa&&$('#lst')){$('#kp').innerHTML=kpiHtml(k);$('#lst').innerHTML=lista;ligarVivo();pintarMapa(E,sit);return}
 $('#main').innerHTML=`<div class="kpis" id="kp">${kpiHtml(k)}</div><div class="live"><div><div id="mapa"></div><div class="leg">${Object.keys(CATEGORIAS).map(c=>`<span><i style="background:${cor(c)}"></i>${c}</span>`).join('')}<span><i style="background:#B8BED6"></i>Sem apontamento</span><span style="color:var(--q)">Posição = último envio do celular (a cada 2 min com o app aberto)</span></div></div><div class="lista" id="lst">${lista}</div></div>`;
 ligarVivo();S.mapa=null;S.mk={};
 if(window.L){S.mapa=L.map('mapa').setView([-3.76,-38.55],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(S.mapa);pintarMapa(E,sit,true)}
 else $('#mapa').innerHTML='<div class="vz" style="padding-top:120px">Mapa indisponível (sem acesso à biblioteca de mapas). A lista ao lado continua funcionando.</div>'}

function ligarVivo(){document.querySelectorAll('.kpi[data-c]').forEach(k=>k.onclick=()=>{S.filtroCat=k.dataset.c&&S.filtroCat!==k.dataset.c?k.dataset.c:null;vVivo()});
 document.querySelectorAll('.eqc').forEach(c=>c.onclick=()=>detalheEquipe(c.dataset.e))}
function pintarMapa(E,sit,ajustar){if(!S.mapa||!window.L)return;const pts=[];
 E.forEach(e=>{if(e.ult_lat==null||!e.turno){if(S.mk[e.id]){S.mapa.removeLayer(S.mk[e.id]);delete S.mk[e.id]}return}

 const ov=modal(`${esc(e.id)} · ${esc(e.nome)}`,`<div class="acts" style="margin-bottom:12px">${S.eu.editor?`<button class="btn" id="dq_l">+ Lançar atividade</button><button class="btn mg" id="dq_d">📋 Despachar tarefa</button>`:''}<button class="btn sec" id="dq_t">🗺 Ver trilha do dia no mapa</button></div>

 if(S.eu.editor){ov.querySelector('#dq_l').onclick=()=>{ov.remove();editarAtiv(null,id)};ov.querySelector('#dq_d').onclick=()=>{ov.remove();S.aba='despacho';S.preEq=id;render()}}

   if(!S.mapa||!window.L)return toast('Mapa indisponível');if(S.trilha)S.mapa.removeLayer(S.trilha);if(!p.length)return toast('Sem posições hoje para '+id);
   S.trilha=L.layerGroup([L.polyline(p.map(x=>[x[1],x[2]]),{color:'#E12379',weight:4,opacity:.8}),L.circleMarker([p[0][1],p[0][2]],{radius:7,color:'#12A36B',fillOpacity:1}).bindTooltip('Início '+hm(new Date(p[0][0]*1000).toISOString()))]).addTo(S.mapa);
   S.mapa.fitBounds(p.map(x=>[x[1],x[2]]),{padding:[40,40]});toast(`Trilha de ${id}: ${p.length} posições`)}catch(er){erro(er)}}}

async function periodo(de,ate,eq){if(de===ymd(new Date())&&ate===de&&!eq)return {atividades:S.P.atividades.filter(a=>a.status!=='cancelada'),turnos:S.P.turnos,tarefas:S.P.tarefas};
 const r=await rpc('ap_bo_atividades',{p_token:S.token,p_de:dia(de).toISOString(),p_ate:new Date(dia(ate).getTime()+864e5).toISOString(),p_equipe:eq||null});r.atividades=r.atividades.filter(a=>a.status!=='cancelada');return r}
function resumoEquipes(D){const now=agora();const R={};
 (D.turnos||[]).forEach(t=>{const r=R[t.equipe_id]=R[t.equipe_id]||{eq:t.equipe_id,turno:0,cats:{},os:new Set(),exec:0,execN:0,desl:0,turnos:0};r.turno+=new Date(t.fim||now)-new Date(t.inicio);r.turnos++});
 (D.atividades||[]).forEach(a=>{const r=R[a.equipe_id]=R[a.equipe_id]||{eq:a.equipe_id,turno:0,cats:{},os:new Set(),exec:0,execN:0,desl:0,turnos:0};const ms=new Date(a.fim||now)-new Date(a.inicio);const c=catDe(a);r.cats[c]=(r.cats[c]||0)+ms;
  if(c==='Produtiva'){r.exec+=ms;r.execN++;if(a.os)r.os.add(a.os)}if(c==='Deslocamento')r.desl+=ms});
 Object.values(R).forEach(r=>{const ap=Object.values(r.cats).reduce((x,y)=>x+y,0);r.ap=ap;r.base=Math.max(r.turno,ap);r.sem=Math.max(0,r.turno-ap);if(r.sem>0)r.cats['Sem apontamento']=r.sem});return Object.values(R).sort((a,b)=>a.eq.localeCompare(b.eq))}

 const png=async()=>{el.style.transform='none';try{return await htmlToImage.toBlob(el.firstElementChild,{pixelRatio:1.5,backgroundColor:'#fff',width:1080})}finally{el.style.transform='scale(.78)'}};
 ov.querySelector('#cd').onclick=async()=>{try{const b=await png();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`Tempo_equipes_${S.iDe}_${S.iAte}.png`;a.click()}catch(e){erro(e)}};
 ov.querySelector('#cc').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':await png()})]);toast('Imagem copiada')}catch(e){toast('Use Baixar PNG')}}}
function exportar(D){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const now=agora();
 const lin=[['Equipe','Turno','Atividade','Categoria','Início','Fim','Duração (min)','OS','Tarefa','Detalhes','Observação','Origem','Ajustado por','Motivo do ajuste','Lat início','Lng início']].concat(D.atividades.map(a=>[a.equipe_id,a.turno_id,a.tipo,catDe(a),dmh(a.inicio),a.fim?dmh(a.fim):'em andamento',Math.round((new Date(a.fim||now)-new Date(a.inicio))/60000),a.os,a.tarefa_id,Object.entries(a.dados||{}).map(x=>x.join(': ')).join(' | '),a.obs,a.origem,a.editado_por||(a.origem==='backoffice'?a.criado_por:''),a.motivo_edicao,a.lat_ini,a.lng_ini]));
 const blob=new Blob(['﻿'+lin.map(l=>l.map(q).join(';')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Apontamentos_${S.iDe||S.aDe}_${S.iAte||S.aAte}.csv`;a.click()}

// ===== APONTAMENTOS =====
async function vApont(){const hoje=ymd(new Date());S.aDe=S.aDe||hoje;S.aAte=S.aAte||hoje;
 $('#main').innerHTML=`<div class="acts" style="justify-content:space-between"><div class="h1">Apontamentos</div><div class="acts">${S.eu.editor?'<button class="btn" id="an">+ Lançar atividade</button>':''}<button class="btn sec" id="ax">⬇ Exportar CSV</button></div></div>
 <div class="filtros"><label>De</label><input type="date" id="a1" value="${S.aDe}"><label>até</label><input type="date" id="a2" value="${S.aAte}"><select id="a3"><option value="">Todas as equipes</option>${(S.P.equipes||[]).map(e=>`<option ${S.aEq===e.id?'selected':''} value="${esc(e.id)}">${esc(e.id)}</option>`).join('')}</select>
 <select id="a4"><option value="">Todas as atividades</option>${tipos().map(t=>`<option ${S.aTp===t.nome?'selected':''}>${esc(t.nome)}</option>`).join('')}</select><select id="a5"><option value="">Celular e COI</option><option value="backoffice" ${S.aOr==='backoffice'?'selected':''}>Só lançados/ajustados pelo COI</option></select></div><div id="at"><div class="vz">Carregando…</div></div>`;
 const ch=(id,k)=>$(id).onchange=e=>{S[k]=e.target.value;vApont()};ch('#a1','aDe');ch('#a2','aAte');ch('#a3','aEq');ch('#a4','aTp');ch('#a5','aOr');if($('#an'))$('#an').onclick=()=>editarAtiv(null,S.aEq||null);
 let D;try{D=await periodo(S.aDe,S.aAte,S.aEq)}catch(e){return erro(e)}let A=D.atividades.filter(a=>(!S.aTp||a.tipo===S.aTp)&&(!S.aOr||a.origem==='backoffice'||a.editado_por));const now=agora();
 $('#ax').onclick=()=>exportar({atividades:A});
 $('#at').innerHTML=`<div class="sub" style="margin:0 0 8px">${A.length} apontamento(s)${S.eu.editor?' · clique para ajustar':''}</div><div style="overflow:auto;max-height:70vh"><table class="t"><tr><th>Equipe</th><th>Atividade</th><th>Início</th><th>Fim</th><th class="num">Duração</th><th>OS</th><th>Detalhes</th><th>Origem</th><th>GPS</th></tr>
 ${A.slice().reverse().map(a=>{const t=tipo(a.tipo);const ac=t.esp&&new Date(a.fim||now)-new Date(a.inicio)>t.esp*60000;return `<tr class="r" data-a="${esc(a.id)}"><td><b>${esc(a.equipe_id)}</b></td><td><span style="color:${cor(catDe(a))}">●</span> ${esc(a.tipo)}</td><td>${dmh(a.inicio)}</td><td>${a.fim?dmh(a.fim):'<b>agora</b>'}${a.fim_auto?' <small title="Encerrada ao iniciar a próxima">↪</small>':''}</td>
  <td class="num" style="${ac?'color:#D93A3E;font-weight:700':''}">${dur(new Date(a.fim||now)-new Date(a.inicio))}</td><td>${esc(a.os||'')}</td><td>${esc(Object.values(a.dados||{}).filter(Boolean).join(' · '))}${a.obs?' · '+esc(a.obs):''}</td>
  <td>${a.origem==='backoffice'?'<span class="tag" style="background:#FFF3B8">COI</span>':'celular'}${a.editado_por?' <span class="tag" style="background:#FFE1E2" title="'+esc(a.motivo_edicao||'')+'">ajustado</span>':''}</td><td>${a.lat_ini?`<a href="https://www.google.com/maps?q=${a.lat_ini},${a.lng_ini}" target="_blank">📍</a>`:''}</td></tr>`}).join('')}</table></div>`;
 document.querySelectorAll('tr.r').forEach(r=>r.onclick=()=>{const a=A.find(x=>x.id===r.dataset.a);if(a)editarAtiv(a)})}

// ===== CADASTROS =====
async function vCad(){const ed=S.eu.editor;const E=S.P.equipes||[];
 $('#main').innerHTML=`<div class="h1">Cadastros</div>
 <div class="box"><h3>Equipes</h3><div class="sub" style="margin:0 0 10px">O código é o login da equipe no celular. A senha é da equipe (compartilhada no veículo).</div>
  <table class="t"><tr><th>Código</th><th>Nome</th><th>Tipo</th><th>Unidade</th><th>Base</th><th>Placa</th><th>Ativa</th><th>Último sinal</th><th></th></tr>${E.map(e=>`<tr><td><b>${esc(e.id)}</b></td><td>${esc(e.nome)}</td><td>${esc(e.tipo||'')}</td><td>${esc(e.unidade||'')}</td><td>${esc(e.base||'')}</td><td>${esc(e.placa||'')}</td><td>${e.ativo?'Sim':'Não'}</td><td>${e.ult_sync_em?dmh(e.ult_sync_em):'–'}</td><td>${ed?`<button class="btn sm sec" data-ee="${esc(e.id)}">Editar</button>`:''}</td></tr>`).join('')}</table>
  ${ed?'<button class="btn" style="margin-top:10px" id="ne">+ Nova equipe</button>':''}</div>
 <div class="box"><h3>Tipos de atividade</h3><div class="sub" style="margin:0 0 10px">Botões que aparecem no celular. "Previsto" gera o alerta de atividade longa. Campos: os, destino, resultado, obs, litros, km, local, volume, motivo, motivo_espera, equipe_apoio.</div>
  <div style="overflow:auto"><table class="t" id="tt"><tr><th>Ícone</th><th>Nome</th><th>Categoria</th><th class="num">Previsto (min)</th><th>Campos ao iniciar</th><th>Campos ao finalizar</th><th>Ativo</th></tr>
  ${tipos().map((t,i)=>`<tr data-i="${i}" data-id="${esc(t.id)}"><td><input value="${esc(t.ico||'')}" style="width:46px" ${ed?'':'disabled'}></td><td><input value="${esc(t.nome)}" style="width:260px" ${ed?'':'disabled'}></td><td><select ${ed?'':'disabled'}>${Object.keys(CATEGORIAS).map(c=>`<option ${c===t.cat?'selected':''}>${c}</option>`).join('')}</select></td>
   <td><input type="number" value="${t.esp||''}" style="width:70px" ${ed?'':'disabled'}></td><td><input value="${esc((t.ini||[]).join(', '))}" ${ed?'':'disabled'}></td><td><input value="${esc((t.fim||[]).join(', '))}" ${ed?'':'disabled'}></td><td><input type="checkbox" ${t.ativo!==false?'checked':''} ${ed?'':'disabled'}></td></tr>`).join('')}</table></div>
  ${ed?`<div class="acts" style="margin-top:10px"><button class="btn sec" id="nt">+ Novo tipo</button><button class="btn" id="st">Salvar tipos</button><button class="btn sec" id="rt">Restaurar padrão</button></div>`:''}</div>
 <div class="grid2"><div class="box"><h3>Programadores que editam</h3><div class="sub" style="margin:0 0 8px">Todos do portal COI veem. Só os marcados despacham e ajustam. Requer a senha de administrador do portal.</div><div class="acts"><input type="password" id="ad" placeholder="Senha de administrador" style="padding:7px;border:1px solid var(--ln);border-radius:6px"><button class="btn sec" id="adb">Abrir</button></div><div id="adl" style="margin-top:10px"></div></div>
 <div class="box"><h3>Auditoria (últimos 7 dias)</h3><div id="aud" style="max-height:360px;overflow:auto"><div class="vz">Carregando…</div></div></div></div>`;
 document.querySelectorAll('[data-ee]').forEach(b=>b.onclick=()=>editarEquipe(E.find(e=>e.id===b.dataset.ee)));if($('#ne'))$('#ne').onclick=()=>editarEquipe(null);
 if(ed){$('#nt').onclick=()=>{const tr=document.createElement('tr');tr.dataset.id='t'+Date.now().toString(36);tr.innerHTML=`<td><input value="•" style="width:46px"></td><td><input style="width:260px" placeholder="Nome da atividade"></td><td><select>${Object.keys(CATEGORIAS).map(c=>`<option>${c}</option>`).join('')}</select></td><td><input type="number" value="30" style="width:70px"></td><td><input></td><td><input></td><td><input type="checkbox" checked></td>`;$('#tt').appendChild(tr)};
  $('#st').onclick=async()=>{const L=[...document.querySelectorAll('#tt tr[data-id]')].map(tr=>{const i=tr.querySelectorAll('input,select');const sp=v=>v.split(',').map(s=>s.trim()).filter(Boolean);return {id:tr.dataset.id,ico:i[0].value,nome:i[1].value.trim(),cat:i[2].value,esp:+i[3].value||null,ini:sp(i[4].value),fim:sp(i[5].value),ativo:i[6].checked}}).filter(t=>t.nome);
   try{const n=Object.assign({},S.cfg,{tipos:L});await rpc('ap_bo_config_salvar',{p_token:S.token,p_dados:n});S.cfg=n;toast('Tipos salvos. Os celulares atualizam na próxima sincronização.')}catch(e){erro(e)}};
  $('#rt').onclick=async()=>{if(!confirm('Voltar para a lista padrão de atividades?'))return;try{const n=Object.assign({},S.cfg,{tipos:TIPOS_PADRAO});await rpc('ap_bo_config_salvar',{p_token:S.token,p_dados:n});S.cfg=n;vCad()}catch(e){erro(e)}}}
 $('#adb').onclick=async()=>{const c=$('#ad').value;try{const L=await rpc('ap_editores_listar',{p_codigo:c});$('#adl').innerHTML=`<table class="t"><tr><th>Usuário</th><th>E-mail</th><th>Programador (edita)</th></tr>${L.map(u=>`<tr><td>${esc(u.nome||'')}</td><td>${esc(u.email)}</td><td><input type="checkbox" data-u="${esc(u.email)}" ${u.editor?'checked':''}></td></tr>`).join('')}</table>`;
   document.querySelectorAll('[data-u]').forEach(x=>x.onchange=async()=>{try{await rpc('ap_editor_definir',{p_codigo:c,p_email:x.dataset.u,p_editor:x.checked});toast('Permissão atualizada')}catch(e){erro(e)}})}catch(e){$('#adl').innerHTML=`<div class="erro">${esc(e.message)}</div>`}};
 try{const L=await rpc('ap_bo_auditoria',{p_token:S.token,p_de:new Date(Date.now()-7*864e5).toISOString()});$('#aud').innerHTML=L.length?`<table class="t"><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Motivo / detalhe</th></tr>${L.map(x=>`<tr><td>${dmh(x.em)}</td><td>${esc(x.usuario)}</td><td>${esc(x.acao.replace(/_/g,' '))}</td><td>${esc((x.dados||{}).motivo||(x.dados&&x.dados.depois&&x.dados.depois.motivo)||x.alvo||'')}</td></tr>`).join('')}</table>`:'<div class="vz">Sem registros</div>'}catch(e){}}
function editarEquipe(e){const novo=!e;e=e||{ativo:true};const ov=modal(novo?'Nova equipe':'Editar equipe '+esc(e.id),`<div class="fr">
 <div class="f"><label>Código (login) <i>*</i></label><input id="q_id" value="${esc(e.id||'')}" ${novo?'':'disabled'} placeholder="Ex.: HJ-01" style="text-transform:uppercase"></div><div class="f w2"><label>Nome <i>*</i></label><input id="q_nm" value="${esc(e.nome||'')}" placeholder="Ex.: Hidrojato 01 – Fortaleza"></div>
 <div class="f"><label>Tipo de equipe</label><input id="q_tp" list="l_tp" value="${esc(e.tipo||'')}"><datalist id="l_tp">${['Hidrojato','Desobstrução','Manutenção de rede','Eletromecânica (EMEC)','Operação de estações','Vistoria','Limpa-fossa'].map(x=>`<option value="${x}">`).join('')}</datalist></div>
 <div class="f"><label>Unidade</label><select id="q_un"><option value="">–</option>${['UN-PMN','UN-PMS'].map(x=>`<option ${e.unidade===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="f"><label>Base</label><input id="q_bs" value="${esc(e.base||'')}"></div>
 <div class="f"><label>Placa padrão</label><input id="q_pl" value="${esc(e.placa||'')}" style="text-transform:uppercase"></div><div class="f"><label>${novo?'Senha <i>*</i>':'Nova senha (vazio = manter)'}</label><input id="q_sn" type="text" placeholder="mín. 4 caracteres"></div>
 <div class="f"><label>Ativa</label><select id="q_at"><option value="true" ${e.ativo?'selected':''}>Sim</option><option value="false" ${e.ativo?'':'selected'}>Não</option></select></div></div>
 <div class="sub" style="margin:10px 0 0">Trocar a senha ou desativar desconecta o celular da equipe.</div><div class="acts" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="q_s">Salvar</button></div>`,760);
 ov.querySelector('#q_s').onclick=async()=>{const id=ov.querySelector('#q_id').value.trim().toUpperCase();if(!id||!ov.querySelector('#q_nm').value.trim())return toast('Código e nome são obrigatórios');
  try{await rpc('ap_bo_equipe_salvar',{p_token:S.token,p_id:id,p_dados:{nome:ov.querySelector('#q_nm').value.trim(),tipo:ov.querySelector('#q_tp').value.trim(),unidade:ov.querySelector('#q_un').value,base:ov.querySelector('#q_bs').value.trim(),placa:ov.querySelector('#q_pl').value.trim().toUpperCase(),ativo:ov.querySelector('#q_at').value==='true'},p_senha:ov.querySelector('#q_sn').value||null});
   ov.remove();toast('Equipe salva');await carregar(true);vCad()}catch(er){erro(er)}}}

(()=>{if(S.token)iniciar();else telaLogin()})();
</script>
</body>
