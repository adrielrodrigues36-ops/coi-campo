<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão à vista · COI Ambiental Ceará</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--az:#0027BD;--ma:#0B1A5C;--cz:#5A6699;--bd:#D3D8EA;--bg:#F4F6FB;--ok:#12A36B;--at:#E8A317;--off:#9AA3C4;--rs:#E12379}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ma);background:var(--bg);font-size:14px}
header{background:var(--az);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}
header .info{font-size:12px;opacity:.9}
.pulso{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CFFB2;margin-right:6px;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
button{font:inherit;cursor:pointer;border:1px solid var(--az);background:#fff;color:var(--az);padding:6px 12px;border-radius:6px}
button.pri{background:var(--az);color:#fff}
button.sair{border-color:#fff;background:transparent;color:#fff}
.tabs{display:flex;gap:6px;padding:10px 16px 0}
.tabs button{border-radius:6px 6px 0 0;border-bottom:none}
.tabs button.on{background:var(--ma);color:#fff;border-color:var(--ma)}
.resumo{display:flex;gap:10px;padding:10px 16px;flex-wrap:wrap}
.kp{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--az);border-radius:6px;padding:6px 10px;min-width:130px}
.kp small{color:var(--cz);display:block}.kp b{font-size:16px}
main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:12px;padding:0 16px 16px;height:calc(100vh - 190px);min-height:420px}
.col{overflow:auto}
.mapa{border-radius:8px;border:1px solid var(--bd);height:100%;min-height:380px}
.card{background:#fff;border:1px solid var(--bd);border-left:6px solid var(--off);border-radius:8px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.card.ativo{border-left-color:var(--ok)}
.card.parado{border-left-color:var(--at)}
.card h2{font-size:15px;margin:0 0 4px}
.card .st{font-weight:bold}
.card .det{color:var(--cz);font-size:12px;margin-top:4px;line-height:1.5}
.bolinha{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.vazio{color:var(--cz);padding:20px;text-align:center}
.hist{display:none}
.hist.on{display:grid}
.linha{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linha .txt{flex:1;min-width:200px}
.linha small{color:var(--cz)}
#login{position:fixed;inset:0;background:var(--az);display:flex;align-items:center;justify-content:center;z-index:9999}
#login .box{background:#fff;padding:26px;border-radius:10px;width:min(360px,92vw)}
#login h2{margin:0 0 4px;color:var(--ma)}
#login p{color:var(--cz);margin:0 0 14px;font-size:13px}
#login label{display:block;font-size:12px;color:var(--cz);margin-top:10px}
#login input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;font:inherit;margin-top:3px}
#login .erro{color:var(--rs);font-size:13px;margin-top:10px;min-height:16px}
#login button{width:100%;margin-top:14px;padding:10px}
.aviso{background:#FFF7E0;border:1px solid #E8D090;padding:10px;border-radius:6px;margin:10px 0;font-size:12px}
@media(max-width:820px){main{grid-template-columns:1fr;height:auto}.mapa{min-height:320px}}
</style>
</head>
<body>

<div id="login" style="display:none">
  <form class="box" id="frmLogin">
    <h2>Gestão à vista</h2>
    <p>Acompanhamento das equipes de campo. Entre com seu e-mail e senha do Portal COI.</p>
    <label>E-mail<input id="lgE" type="email" autocomplete="username" required></label>
    <label>Senha<input id="lgS" type="password" autocomplete="current-password" required></label>
    <div id="trocaBox" style="display:none">
      <div class="aviso">Primeiro acesso: defina uma nova senha (mínimo de 8 caracteres).</div>
      <label>Nova senha<input id="lgN" type="password" autocomplete="new-password"></label>
      <label>Confirmar nova senha<input id="lgN2" type="password" autocomplete="new-password"></label>
    </div>
    <div class="erro" id="lgErro"></div>
    <button class="pri" type="submit" id="lgBtn">Entrar</button>
  </form>
</div>

<header>
  <h1>Gestão à vista · Equipes de campo</h1>
  <span class="info"><span class="pulso"></span><span id="atualizado">—</span></span>
  <span class="info" id="quem"></span>
  <button class="sair" id="btnSair">Sair</button>
</header>

<div class="tabs">
  <button id="tAoVivo" class="on">Ao vivo</button>
  <button id="tHist">Percurso por data</button>
</div>

<div class="resumo" id="resumo"></div>

<div id="vAoVivo">
  <main>
    <div class="col" id="lista"></div>
    <div class="mapa" id="mapa"></div>
  </main>
</div>

<div id="vHist" class="hist">
  <div style="padding:0 16px 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label>Data: <input type="date" id="dia"></label>
    <span id="histInfo" style="color:var(--cz)"></span>
  </div>
  <main>
    <div class="col" id="listaHist"></div>
    <div class="mapa" id="mapaHist"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SB_URL='https://tstulvyvkgjyfnjffips.supabase.co',SB_KEY='sb_publishable_reUYlIVvTJyTNmcUD4jyxQ_0voFqHA6',VER=1,BR='America/Fortaleza';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=iso=>iso?new Date(iso).toLocaleTimeString('pt-BR',{timeZone:BR,hour:'2-digit',minute:'2-digit'}):'–';
const diaBR=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:BR});
const inicioDia=ymd=>new Date(ymd+'T00:00:00-03:00').toISOString();
const minAtras=iso=>Math.round((Date.now()-new Date(iso).getTime())/60000);
const haversineKm=p=>p.reduce((s,q,i)=>{if(!i)return s;const A=p[i-1],R=6371,r=x=>x*Math.PI/180;const dLa=r(q[1]-A[1]),dLo=r(q[2]-A[2]);const h=Math.sin(dLa/2)**2+Math.cos(r(A[1]))*Math.cos(r(q[1]))*Math.sin(dLo/2)**2;return s+2*R*Math.asin(Math.sqrt(h))},0);

const S={tok:sessionStorage.getItem('gestao_tok'),eu:sessionStorage.getItem('gestao_nome')||'',
  eq:[],turnos:[],ativs:[],pos:{},lastId:0,tab:'ao_vivo',timer:null,mapa:null,grupo:null,ajustou:false,
  mapaH:null,grupoH:null,dia:diaBR(new Date())};

// ---------- conexão ----------
async function rpc(fn,a){
  const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
  if(S.tok)h['x-coi-token']=S.tok;
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(a||{})});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||t||'Erro '+r.status);
  return j;
}

// ---------- login ----------
function mostrarLogin(msg){
  $('#login').style.display='flex';$('#lgErro').textContent=msg||'';
  $('#lgS').value='';
}
function sair(msg){
  sessionStorage.removeItem('gestao_tok');sessionStorage.removeItem('gestao_nome');
  S.tok=null;clearInterval(S.timer);mostrarLogin(msg||'');
}
$('#btnSair').onclick=()=>sair('');
$('#frmLogin').onsubmit=async e=>{
  e.preventDefault();
  const email=$('#lgE').value.trim(),senha=$('#lgS').value;
  $('#lgBtn').disabled=true;$('#lgErro').textContent='';
  try{
    let r=await rpc('sv_login',{p_email:email,p_senha:senha,p_app:'gestao',p_ver:VER});
    if(r&&r.erro)throw new Error(r.erro);
    if(r.trocar){
      const n=$('#lgN').value,n2=$('#lgN2').value;
      $('#trocaBox').style.display='block';
      if(!n){throw new Error('Defina a nova senha para continuar.')}
      if(n.length<8||n!==n2)throw new Error('As senhas não conferem ou têm menos de 8 caracteres.');
      const tr=await rpc('sv_trocar_senha',{p_email:email,p_atual:senha,p_nova:n});
      if(tr&&tr.erro)throw new Error(tr.erro);
      r=await rpc('sv_login',{p_email:email,p_senha:n,p_app:'gestao',p_ver:VER});
      if(r&&r.erro)throw new Error(r.erro);
    }
    S.tok=r.token;S.eu=r.nome||email;
    sessionStorage.setItem('gestao_tok',S.tok);sessionStorage.setItem('gestao_nome',S.eu);
    $('#login').style.display='none';$('#quem').textContent=S.eu;
    iniciar();
  }catch(err){$('#lgErro').textContent=err.message}
  finally{$('#lgBtn').disabled=false}
};

// ---------- mapas ----------
function criarMapas(){
  S.mapa=L.map('mapa').setView([-3.76,-38.55],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(S.mapa);
  S.grupo=L.layerGroup().addTo(S.mapa);
  S.mapaH=L.map('mapaHist').setView([-3.76,-38.55],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(S.mapaH);
  S.grupoH=L.layerGroup().addTo(S.mapaH);
}

// ---------- estado das equipes ----------
function situacao(e){
  const P=S.pos[e.id];const idade=P?minAtras(P.em):null;
  const online=idade!=null&&idade<=5;
  let cls='',txt='Fora de turno',cor='#9AA3C4';
  if(e.turno&&!e.turno.fim){
    if(e.atual){cls='ativo';txt='Em atividade: '+esc(e.atual.tipo);cor='#12A36B'}
    else{cls='parado';txt='Em turno, sem atividade';cor='#E8A317'}
  }
  if(!online)cor='#9AA3C4';
  return {cls,txt,cor,online,idade,P};
}
const nomeEq=id=>{const e=S.eq.find(x=>x.id===id);return e&&e.nome?e.nome:id};

function renderResumo(){
  const abertos=S.eq.filter(e=>e.turno&&!e.turno.fim);
  const ativos=abertos.filter(e=>e.atual).length;
  const semSinal=abertos.filter(e=>{const s=situacao(e);return !s.online}).length;
  $('#resumo').innerHTML=
   `<div class="kp"><small>Equipes</small><b>${S.eq.length}</b></div>`+
   `<div class="kp"><small>Em turno</small><b>${abertos.length}</b></div>`+
   `<div class="kp"><small>Em atividade</small><b>${ativos}</b></div>`+
   `<div class="kp"><small>Sem sinal (&gt; 5 min)</small><b>${semSinal}</b></div>`;
}

function renderLive(){
  renderResumo();
  const lista=$('#lista');
  if(!S.eq.length){lista.innerHTML='<div class="vazio">Nenhuma equipe cadastrada.</div>';return}
  lista.innerHTML=S.eq.map(e=>{
    const s=situacao(e);const T=e.turno&&!e.turno.fim?e.turno:null;
    const bat=s.P&&s.P.bat!=null?` · bateria ${Math.round(s.P.bat)}%`:'';
    return `<div class="card ${s.cls}" data-id="${esc(e.id)}">
      <h2>${esc(nomeEq(e.id))}</h2>
      <div class="st"><span class="bolinha" style="background:${s.cor}"></span>${s.txt}</div>
      <div class="det">${T?`Turno desde ${hm(T.inicio)}${T.integrantes?' · '+esc(T.integrantes):''}${T.placa?' · placa '+esc(T.placa):''}`:'Sem turno aberto'}<br>
      ${s.P?`Última posição há ${s.idade} min · ${s.online?'<b style="color:#12A36B">online</b>':'<b style="color:#E12379">sem sinal</b>'}${bat}`:'Sem posição recebida'}</div>
    </div>`}).join('');
  lista.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    const P=S.pos[c.dataset.id];if(P&&S.mapa)S.mapa.setView([P.lat,P.lng],15);
  });
  desenharEquipes();
}

function desenharEquipes(){
  if(!S.grupo)return;
  S.grupo.clearLayers();
  const pts=[];
  S.eq.forEach(e=>{
    const s=situacao(e);if(!s.P)return;
    pts.push([s.P.lat,s.P.lng]);
    L.circleMarker([s.P.lat,s.P.lng],{radius:9,color:'#fff',weight:2,fillColor:s.cor,fillOpacity:1})
      .bindTooltip(`<b>${esc(nomeEq(e.id))}</b><br>${s.txt}<br>${s.online?'online':'sem sinal'} · ${hm(s.P.em)}`)
      .addTo(S.grupo);
  });
  if(pts.length&&!S.ajustou){S.mapa.fitBounds(pts,{padding:[40,40]});S.ajustou=true}
}

// ---------- atualização ----------
async function atualizar(){
  try{
    const p=await rpc('gestao_painel',{p_desde:inicioDia(diaBR(new Date()))});
    S.eq=p.equipes||[];S.ativs=p.atividades||[];S.turnos=p.turnos||[];
    const novas=await rpc('gestao_posicoes',{p_de:new Date(Date.now()-60*60e3).toISOString(),p_ate:new Date(Date.now()+864e5).toISOString(),p_equipe:null,p_apos:S.lastId});
    novas.forEach(r=>{
      const [id,eqId,em,lat,lng,prec,vel,bat]=r;
      const atual=S.pos[eqId];
      if(!atual||new Date(em)>=new Date(atual.em))S.pos[eqId]={em,lat,lng,bat};
      if(id>S.lastId)S.lastId=id;
    });
    $('#atualizado').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{timeZone:BR,hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if(S.tab==='ao_vivo')renderLive();
  }catch(err){
    if(/Acesso negado/i.test(err.message)){sair('Sua sessão expirou ou você não tem acesso à gestão. Entre de novo.');return}
    $('#atualizado').textContent='Falha ao atualizar: '+err.message;
  }
}

function iniciar(){
  if(!S.mapa)criarMapas();
  $('#quem').textContent=S.eu;
  $('#dia').value=S.dia;
  atualizar();
  clearInterval(S.timer);
  S.timer=setInterval(atualizar,30000);
}

// ---------- abas ----------
function trocarAba(aba){
  S.tab=aba;
  $('#tAoVivo').classList.toggle('on',aba==='ao_vivo');
  $('#tHist').classList.toggle('on',aba==='hist');
  $('#vAoVivo').style.display=aba==='ao_vivo'?'block':'none';
  $('#vHist').classList.toggle('on',aba==='hist');
  $('#resumo').style.display=aba==='ao_vivo'?'flex':'none';
  if(aba==='ao_vivo'){renderLive();setTimeout(()=>S.mapa.invalidateSize(),50)}
  else{carregarDia();setTimeout(()=>S.mapaH.invalidateSize(),50)}
}
$('#tAoVivo').onclick=()=>trocarAba('ao_vivo');
$('#tHist').onclick=()=>trocarAba('hist');

// ---------- histórico por data ----------
$('#dia').onchange=e=>{S.dia=e.target.value;carregarDia()};

async function carregarDia(){
  const dia=S.dia;
  $('#listaHist').innerHTML='<div class="vazio">Carregando…</div>';
  try{
    const p=await rpc('gestao_painel',{p_desde:inicioDia(dia)});
    const turnos=(p.turnos||[]).filter(t=>diaBR(t.inicio)===dia);
    const eqs=p.equipes||[];
    S.histAtiv=(p.atividades||[]);
    S.histTurnos=turnos;
    $('#histInfo').textContent=`${turnos.length} turno(s) em ${new Date(dia+'T12:00:00').toLocaleDateString('pt-BR')}`;
    if(!turnos.length){$('#listaHist').innerHTML='<div class="vazio">Nenhum turno nesta data.</div>';S.grupoH.clearLayers();return}
    $('#listaHist').innerHTML=turnos.sort((a,b)=>new Date(a.inicio)-new Date(b.inicio)).map((t,i)=>`
      <div class="linha">
        <div class="txt"><b>${esc(nomeEq(t.equipe_id))}</b><br>
        <small>${hm(t.inicio)} até ${t.fim?hm(t.fim):'agora (turno aberto)'}${t.integrantes?' · '+esc(t.integrantes):''}${t.placa?' · '+esc(t.placa):''}${t.km_ini!=null?' · km '+esc(t.km_ini)+(t.km_fim!=null?' a '+esc(t.km_fim):''):''}</small></div>
        <button data-i="${i}" class="pri" data-acao="mapa">Ver percurso</button>
        <button data-i="${i}" data-acao="pdf">Relatório PDF</button>
      </div>`).join('');
    $('#listaHist').querySelectorAll('button').forEach(b=>{
      const t=turnos.sort((a,b)=>new Date(a.inicio)-new Date(b.inicio))[b.dataset.i];
      b.onclick=()=>b.dataset.acao==='mapa'?verPercurso(t):relatorioPdf(t);
    });
    S.grupoH.clearLayers();
  }catch(err){
    $('#listaHist').innerHTML=`<div class="vazio">${esc(err.message)}</div>`;
  }
}

async function buscarTrilha(t){
  const ate=t.fim?t.fim:new Date(Date.now()+864e5).toISOString();
  return rpc('gestao_trilha',{p_equipe:t.equipe_id,p_de:t.inicio,p_ate:ate});
}

async function verPercurso(t){
  try{
    const p=await buscarTrilha(t);
    S.grupoH.clearLayers();
    if(!p.length){alert('Sem posições GPS neste turno.');return}
    const ll=p.map(x=>[x[1],x[2]]);
    L.polyline(ll,{color:'#E12379',weight:4,opacity:.8}).addTo(S.grupoH);
    L.circleMarker(ll[0],{radius:8,color:'#12A36B',fillColor:'#12A36B',fillOpacity:1}).bindTooltip('Início · '+hm(new Date(p[0][0]*1000).toISOString())).addTo(S.grupoH);
    L.circleMarker(ll[ll.length-1],{radius:8,color:'#0B1A5C',fillColor:'#0B1A5C',fillOpacity:1}).bindTooltip((t.fim?'Fim · ':'Última posição · ')+hm(new Date(p[p.length-1][0]*1000).toISOString())).addTo(S.grupoH);
    S.mapaH.fitBounds(ll,{padding:[30,30]});
    $('#histInfo').textContent=`${nomeEq(t.equipe_id)}: ${p.length} posições · ${haversineKm(p.map(x=>[x[0],x[1],x[2]])).toFixed(1).replace('.',',')} km (linha entre posições)`;
  }catch(err){alert(err.message)}
}

async function relatorioPdf(t){
  const w=window.open('','_blank');
  if(!w){alert('O navegador bloqueou a janela. Permita pop-ups deste site.');return}
  w.document.write('<p style="font-family:Arial;padding:20px">Gerando relatório…</p>');
  try{
    const p=await buscarTrilha(t);
    const ini=new Date(t.inicio),fimT=t.fim?new Date(t.fim):new Date(Date.now()+864e5);
    const atv=(S.histAtiv||[]).filter(a=>a.equipe_id===t.equipe_id&&new Date(a.inicio)>=ini&&new Date(a.inicio)<fimT);
    const km=p.length>1?haversineKm(p.map(x=>[x[0],x[1],x[2]])):0;
    const linhas=atv.map(a=>`<tr><td>${esc(a.tipo)}</td><td>${hm(a.inicio)}</td><td>${a.fim?hm(a.fim):'em andamento'}</td><td>${esc(a.os||'–')}</td><td>${esc((a.dados||{}).resultado||'')}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum apontamento no turno</td></tr>';
    const dia=diaBR(t.inicio);
    const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Percurso ${esc(nomeEq(t.equipe_id))} · ${esc(dia)}</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@page{size:A4;margin:12mm}
body{font-family:Arial,Helvetica,sans-serif;color:#0B1A5C;font-size:12px;margin:18px}
h1{font-size:18px;color:#0027BD;margin:0 0 2px}
.sub{color:#5A6699;margin-bottom:12px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kp div{border-left:4px solid #0027BD;padding:6px 8px;background:#F4F6FB}
.kp small{color:#5A6699;display:block}.kp b{font-size:15px}
table{width:100%;border-collapse:collapse;margin:8px 0 12px}
th,td{border-bottom:1px solid #D3D8EA;padding:5px 6px;text-align:left;font-size:11px}
th{color:#0027BD;border-top:2px solid #0027BD;border-bottom:2px solid #0027BD}
#m{height:340px;border:1px solid #D3D8EA;border-radius:6px;margin:8px 0}
.rod{margin-top:10px;color:#5A6699;font-size:10px}
@media print{.noprint{display:none}}
</style></head><body>
<div class="noprint"><button onclick="window.print()">Imprimir / salvar PDF</button></div>
<h1>Percurso da equipe ${esc(nomeEq(t.equipe_id))}</h1>
<div class="sub">${esc(dia)}</div>
<div class="kp">
<div><small>Início do turno</small><b>${hm(t.inicio)}</b></div>
<div><small>Fim do turno</small><b>${t.fim?hm(t.fim):'em andamento'}</b></div>
<div><small>Distância (linha entre posições)</small><b>${km.toFixed(1).replace('.',',')} km</b></div>
<div><small>Posições GPS</small><b>${p.length}</b></div>
